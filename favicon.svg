<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#000"/>
  <!-- Face oval -->
  <ellipse cx="32" cy="34" rx="18" ry="22" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- Left eye -->
  <ellipse cx="24" cy="28" rx="5" ry="3" fill="none" stroke="#00ffff" stroke-width="1.5"/>
  <!-- Right eye -->
  <ellipse cx="40" cy="28" rx="5" ry="3" fill="none" stroke="#00ffff" stroke-width="1.5"/>
  <!-- Nose -->
  <line x1="32" y1="30" x2="32" y2="38" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Mouth -->
  <path d="M25 42 Q32 48 39 42" fill="none" stroke="#ff00ff" stroke-width="1.5"/>
  <!-- Dots -->
  <circle cx="24" cy="28" r="1" fill="#00ffff"/>
  <circle cx="40" cy="28" r="1" fill="#00ffff"/>
  <circle cx="32" cy="38" r="1" fill="rgba(255,255,255,0.5)"/>
</svg>
